  <div class="btns"><button class="btn sec" onclick="docForm('${p.id}')">Facture / Bon</button>${pLines(p).filter(l=>{const q=findP(l.pid);return q&&q.sn;}).length>1?`<button class="btn sec" onclick="closeModal();const L=pLines(db.purchases.find(x=>x.id==='${p.id}')).map(l=>l.pid).filter(i=>{const q=findP(i);return q&&q.sn;});labelModal(L[0],L)">Étiquettes de l'achat</button>`:''}<button class="btn sec" onclick="printPurchase('${p.id}')">Ticket</button><button class="btn danger" onclick="delPurchase('${p.id}')">Annuler l'achat</button><button class="btn sec" onclick="closeModal()">Fermer</button></div>`);
}
function payPurchase(id){
  const p=db.purchases.find(x=>x.id===id);if(!p)return;const r=pReste(p),m=Math.min(num($('#pp_a').value),r);
  if(m<=0){toast('Montant invalide');return;}
  p.paye+=m;(p.payments=p.payments||[]).push({date:nowI(),montant:m,mode:$('#pp_m').value});
  save();toast('Règlement enregistré');purchaseModal(id);if(tab==='achats')renderPurchases();
}
function delPay(id,i){
  const p=db.purchases.find(x=>x.id===id);if(!p||!p.payments||!p.payments[i])return;
  if(!confirm('Annuler ce règlement ?'))return;
  p.paye=Math.max(0,p.paye-p.payments[i].montant);p.payments.splice(i,1);
  save();purchaseModal(id);if(tab==='achats')renderPurchases();
}
function delPurchase(id){
  const a=db.purchases.find(x=>x.id===id);if(!a)return;
  const L=pLines(a);let short=false;
  L.forEach(l=>{const p=findP(l.pid);if(p&&(+p.qte||0)<l.qte)short=true;});
  if(!confirm("Annuler l'achat "+achNo(a)+' ? Le stock sera diminué des quantités achetées.'+(L.some(l=>l.created)?'\nLes produits créés par cet achat et jamais vendus seront supprimés.':'')+(short?'\n⚠ Certains articles ont déjà été vendus : le stock sera ramené à 0.':'')))return;
  L.forEach(l=>{
    const p=findP(l.pid);if(!p)return;
    const sold=db.sales.some(s=>s.items.some(i=>i.pid===p.id));
    if(l.created&&!sold&&(+p.qte||0)<=l.qte){db.products=db.products.filter(x=>x.id!==p.id);return;}
    p.qte=Math.max(0,(+p.qte||0)-l.qte);
    if(l.prevAchat!=null&&l.newAchat!=null&&p.achat===l.newAchat)p.achat=l.prevAchat;
  });
  db.purchases=db.purchases.filter(x=>x.id!==id);save();closeModal();render();toast('Achat annulé, stock mis à jour');
}
function printPurchase(id){
  const p=db.purchases.find(x=>x.id===id);if(!p)return;const st=db.settings,w=+st.ticketW||80;
  doPrint(`<div class="ticket" style="--tw:${w}mm">${shopHead(st)}<hr><div class="tk-c"><b>BON D'ACHAT ${achNo(p)}</b></div><div class="tk-r"><span>Date</span><span>${fdate(p.date)}</span></div><div>Fournisseur : ${esc(p.fournisseur)}</div>${p.ref?`<div>Facture : ${esc(p.ref)}</div>`:''}<hr>${pLines(p).map(l=>`<div class="tk-it"><div class="tk-nm">${esc(l.designation)}</div><div class="tk-r"><span>${l.qte} × ${fmt(l.achat)}</span><b>${fmt(l.qte*l.achat)}</b></div></div>`).join('')}<hr><div class="tk-r tk-tot"><span>TOTAL</span><span>${fmt(p.total)} DA</span></div><div class="tk-r"><span>Payé</span><span>${fmt(p.paye)} DA</span></div><div class="tk-r"><b>Reste</b><b>${fmt(pReste(p))} DA</b></div></div>`,w,'auto');
}

function saveSup(old){
  old=decodeURIComponent(old);const g=i=>$('#s_'+i).value.trim(),nom=g('nom');
  if(!nom){toast('Indiquez le nom du fournisseur');return;}
  const nk=norm(nom);if(nk!==old&&findS(nk)){toast('Ce fournisseur existe déjà');return;}
  if(old&&nk!==old)db.purchases.forEach(p=>{if(norm(p.fournisseur)===old)p.fournisseur=nom;});
  db.suppliers=db.suppliers.filter(e=>{const z=norm(e.nom);return z!==old&&z!==nk;});
  db.suppliers.push({id:uid(),nom,tel:g('tel'),adr:g('adr'),note:g('note')});
  save();toast('Fournisseur enregistré');supModal(ek(nk));if(tab==='achats')renderPurchases();
}
function delSup(k){
  k=decodeURIComponent(k);const x=findS(k);if(!x)return;
  if(x.du>0){toast('Suppression impossible : dette de '+fmt(x.du)+' DA à régler');return;}
  if(!confirm('Supprimer le fournisseur « '+x.nom+" » ? Ses achats restent dans l'historique."))return;
  db.suppliers=db.suppliers.filter(e=>norm(e.nom)!==k);db.suppliers.push({id:uid(),nom:x.nom,del:nowI()});
  save();closeModal();if(tab==='achats')renderPurchases();toast('Fournisseur supprimé');

function supModal(k){

  ${x.du>0?`<div class="group"><label>Règlement</label><div class="inline"><input id="sp_a" inputmode="numeric" value="${x.du}" style="max-width:130px"><select id="sp_m" style="max-width:170px">${modesOn().map(m=>`<option>${m}</option>`).join('')}</select><button class="btn sm" onclick="paySup('${e}')">Régler</button></div></div>`:''}
  <div class="btns" style="margin:0 0 14px"><button class="btn sec sm" onclick="closeModal();purchaseForm('','${e}')">+ Nouvel achat</button><button class="btn sec sm" onclick="supForm('${e}')">Modifier</button>${x.du>0?'':`<button class="btn danger sm" onclick="delSup('${e}')">Supprimer</button>`}</div>
  <h3 style="margin:6px 0">Achats</h3><table><tbody>${ps.slice(0,40).map(p=>`<tr class="click" onclick="purchaseModal('${p.id}')"><td class="sm muted">${fdate(p.date)}</td><td><b>${achNo(p)}</b> ${esc(pLines(p).map(l=>l.designation).join(', '))}</td><td class="num">${fmt(p.total)}</td><td class="num">${pReste(p)>0?`<span class="badge o">${fmt(pReste(p))}</span>`:'<span class="badge g">Payé</span>'}</td></tr>`).join('')||'<tr><td class="muted">Aucun achat enregistré.</td></tr>'}</tbody></table>
  <div class="btns"><button class="btn sec" onclick="closeModal()">Fermer</button></div>`);
}
function paySup(k){
  k=decodeURIComponent(k);const x=findS(k);if(!x)return;let a=num($('#sp_a').value);
  if(a<=0){toast('Montant invalide');return;}
  if(a>x.du){toast('Le règlement dépasse la dette ('+fmt(x.du)+' DA)');return;}
  const mode=$('#sp_m').value,now=nowI();
  db.purchases.filter(p=>norm(p.fournisseur)===k&&p.total>p.paye).sort((u,v)=>u.date<v.date?-1:1).forEach(p=>{if(a<=0)return;const m=Math.min(a,p.total-p.paye);p.paye+=m;a-=m;(p.payments=p.payments||[]).push({date:now,montant:m,mode});});
  save();toast('Règlement enregistré');supModal(ek(k));if(tab==='achats')renderPurchases();
}

    const o=el.textContent,m=o.match(/^(-?[\d\s\u00a0\u202f]+)(.*)$/);if(!m)return;

    const t0=performance.now(),step=t=>{const k=Math.min(1,(t-t0)/800);el.textContent=k<1?fmt(to*(1-Math.pow(1-k,3)))+suf:o;if(k<1)requestAnimationFrame(step);};

/* ===== LICENCE ===== */
const LIC_PUB={kty:'EC',crv:'P-256',x:'foB11dSToeM6qnt5pv4hn9UVdQXyHCfKKqAlieU-RGU',y:'tPJCv0WkboOKJFJ_-cwz2G5B-Zp9YJg4KIIIQABp9KU',ext:true};
const B32='ABCDEFGHIJKLMNOPQRSTUVWXYZ234567';
const b32e=u=>{let b=0,v=0,o='';for(const x of u){v=(v<<8)|x;b+=8;while(b>=5){o+=B32[(v>>>(b-5))&31];b-=5;}v&=(1<<b)-1;}if(b)o+=B32[(v<<(5-b))&31];return o;};
const b32d=s=>{let b=0,v=0;const o=[];for(const c of s){const i=B32.indexOf(c);if(i<0)continue;v=(v<<5)|i;b+=5;if(b>=8){o.push((v>>>(b-8))&255);b-=8;v&=(1<<b)-1;}}return new Uint8Array(o);};
const lDay=()=>Math.floor((Date.now()-Date.UTC(2024,0,1))/864e5);
const fmtId=i=>i.slice(0,4)+'-'+i.slice(4);
function licId(){let i=localStorage.getItem('tt23_iid');if(!i){i=b32e(crypto.getRandomValues(new Uint8Array(5)));localStorage.setItem('tt23_iid',i);}return i;}
async function licVerify(code,iid,pub){
  const b=b32d(String(code).toUpperCase().replace(/[^A-Z2-7]/g,''));
  if(b.length!==72)return{ok:false,msg:'Code incomplet ou invalide'};
  const pl=b.slice(0,8),sig=b.slice(8);
  try{const k=await crypto.subtle.importKey('jwk',pub,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);
    if(!await crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,sig,pl))return{ok:false,msg:'Code invalide'};}
  catch(e){return{ok:false,msg:'Vérification impossible sur ce navigateur'};}
  if(b32e(pl.slice(0,5))!==iid)return{ok:false,msg:"Ce code n'est pas destiné à cette installation"};
  const exp=(pl[5]<<8)|pl[6];
  if(exp&&lDay()>exp)return{ok:false,msg:'Licence expirée',exp};
  return{ok:true,exp};
}
let LIC={ok:false};
async function licCheck(){
  const iid=licId(),code=localStorage.getItem('tt23_lic')||'',d=lDay(),seen=+localStorage.getItem('tt23_seen')||0;
  let r=code?await licVerify(code,iid,LIC_PUB):{ok:false};
  if(r.ok&&d<seen-1)r={ok:false,msg:"La date de l'ordinateur est incorrecte"};
  else if(r.ok)localStorage.setItem('tt23_seen',Math.max(seen,d));
  const was=LIC.ok;LIC=r;
  if(r.ok){if(document.getElementById('lic')&&!was)licHide();setupMaybe();if(r.exp&&r.exp-d<=7&&!was)toast('Licence : expire dans '+(r.exp-d)+' jour(s)');}
  else licLock(code?r.msg:'');
  return r;
}

  <div class="group"><label>Code d'accès</label><textarea id="lic_code" rows="4" placeholder="Collez ici votre code…" style="font:14px/1.4 ui-monospace,Consolas,monospace;resize:none;width:100%"></textarea></div>
  <div id="lic_msg" class="sm" style="color:var(--red);min-height:18px;margin-bottom:8px">${esc(msg||'')}</div>
  <div class="btns" style="margin-top:0"><button class="btn" onclick="licActivate()">Activer</button>${LIC.ok?'<button class="btn sec" onclick="licHide()">Annuler</button>':''}</div>
  <div class="muted sm" style="margin-top:18px;text-align:center;line-height:1.6">${esc(copyTxt())}<br>${esc(APP.mail)} · <span dir="ltr">${esc(APP.tel)}</span></div></div>`;
  setTimeout(()=>{const t=document.getElementById('lic_code');if(t)t.focus();},60);
}

async function licActivate(){

const _sv=save;save=function(){_sv();bkSoon();};
const idb=()=>new Promise((res,rej)=>{const r=indexedDB.open('tt23_bak',1);r.onupgradeneeded=()=>{r.result.createObjectStore('kv');r.result.createObjectStore('snaps',{keyPath:'t'});};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});
const idbGet=async(s,k)=>{try{const d=await idb();return await new Promise(r=>{const q=d.transaction(s).objectStore(s).get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r();});}catch(e){}};
const idbPut=async(s,v,k)=>{try{const d=await idb();return await new Promise(r=>{const t=d.transaction(s,'readwrite');t.objectStore(s).put(v,k);t.oncomplete=()=>r(true);t.onerror=()=>r(false);});}catch(e){return false;}};
const bkHash=()=>{const s=JSON.stringify({...db,lastBackup:0});let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return s.length+':'+h;};
const bkJSON=()=>JSON.stringify({app:'tt23-gestion',version:1,exported:nowI(),data:db});
let BK={dir:null,ok:false},bkTimer=0,bkBusy=false,lastClose=0;
/* copies internes (15 dernières), sans autorisation nécessaire */
async function snapAdd(force){
  if(!force&&bkHash()===localStorage.getItem('tt23_snaph'))return;
  try{const d=await idb();
    await new Promise(r=>{const t=d.transaction('snaps','readwrite'),s=t.objectStore('snaps');s.put({t:nowI(),data:JSON.stringify(db)});const k=s.getAllKeys();k.onsuccess=()=>{k.result.sort().slice(0,Math.max(0,k.result.length-15)).forEach(x=>s.delete(x));};t.oncomplete=()=>r();t.onerror=()=>r();});
    localStorage.setItem('tt23_snaph',bkHash());}catch(e){}
}
/* dossier choisi par l'utilisateur (Edge / Chrome) */
async function bkInit(){
  if(!window.showDirectoryPicker)return;
  try{BK.dir=await idbGet('kv','dir')||null;if(BK.dir)BK.ok=(await BK.dir.queryPermission({mode:'readwrite'}))==='granted';}catch(e){BK.dir=null;}
  bkPill();
}
async function bkWrite(force){
  if(!BK.dir||!BK.ok||bkBusy)return false;
  const h=bkHash();if(!force&&h===localStorage.getItem('tt23_bkh'))return false;
  bkBusy=true;
  try{
    db.lastBackup=nowI();
    const d=new Date(),p=n=>String(n).padStart(2,'0'),name='sauvegarde_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'_'+p(d.getHours())+'h'+p(d.getMinutes())+'.json';
    const w=await (await BK.dir.getFileHandle(name,{create:true})).createWritable();await w.write(bkJSON());await w.close();
    localStorage.setItem('tt23_bkh',h);_sv();
    const names=[];for await(const [n] of BK.dir.entries())if(/^sauvegarde_\d{4}-\d\d-\d\d_\d\dh\d\d\.json$/.test(n))names.push(n);
    names.sort().slice(0,Math.max(0,names.length-30)).forEach(n=>BK.dir.removeEntry(n).catch(()=>{}));
    bkBusy=false;renderBanner();if(tab==='reglages')viewSettings();return true;
  }catch(e){bkBusy=false;BK.ok=false;bkPill();return false;}
}
const bkSoon=()=>{clearTimeout(bkTimer);bkTimer=setTimeout(()=>bkWrite(),45000);};
function bkClose(){if(Date.now()-lastClose<3000)return;lastClose=Date.now();snapAdd();bkWrite();}
addEventListener('pagehide',bkClose);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')bkClose();});
function bkPill(){
  let e=document.getElementById('bkpill');
  if(BK.dir&&!BK.ok){if(!e){e=document.createElement('button');e.id='bkpill';e.className='btn sec sm';e.style.cssText='position:fixed;left:16px;bottom:16px;z-index:50;box-shadow:0 4px 14px rgba(0,0,0,.25)';e.onclick=bkAllow;document.body.appendChild(e);}e.textContent='Réactiver la sauvegarde automatique';}
  else if(e)e.remove();
}
async function bkAllow(){
  try{BK.ok=(await BK.dir.requestPermission({mode:'readwrite'}))==='granted';}catch(e){BK.ok=false;}
  bkPill();if(BK.ok){await bkWrite(true);toast('Sauvegarde automatique réactivée');}if(tab==='reglages')viewSettings();
}
async function bkChoose(){
  try{const h=await showDirectoryPicker({id:'tt23bak',mode:'readwrite'});await idbPut('kv',h,'dir');BK.dir=h;BK.ok=true;bkPill();await bkWrite(true);toast('Dossier de sauvegarde : '+h.name);}
  catch(e){if(e.name!=='AbortError')toast('Dossier refusé : choisissez un sous-dossier (ex. Documents\\Sauvegardes)');}

const WA_DEF_AR="مرحبًا {client}،\nهذا تذكير من {boutique} : بقي عليكم {montant} دج للتسديد.\nنرجو منكم المرور في أقرب وقت.\nمع التحية.";

function waNum(t,code){
  let d=String(t||'').replace(/\D/g,'');code=code||'213';
  if(d.startsWith('00'))d=d.slice(2);else if(d.startsWith('0'))d=code+d.slice(1);else if(d.length===9&&/^[567]/.test(d))d=code+d;
  return d.length>=10?d:'';
}
const lastRel=k=>db.relances.filter(r=>r.k===k).map(r=>r.date).sort().pop()||'';
function waText(c){const s=db.settings;return (s.waMsg||waDef()).replace(/\{client\}/g,c.nom).replace(/\{montant\}/g,fmt(c.du)).replace(/\{boutique\}/g,s.shop||'').replace(/\{tel_boutique\}/g,s.tel||'');}
function waForm(k){
  k=decodeURIComponent(k);const c=findC(k);if(!c)return;const l=lastRel(k);
  openModal(`<div class="mh"><h2>Relancer ${esc(c.nom)}</h2><button class="x" onclick="closeModal()">×</button></div>
  <div class="stats" style="margin-bottom:12px"><div class="stat"><small>Crédit restant</small><b class="o">${fmt(c.du)} DA</b></div><div class="stat"><small>Dernière relance</small><b style="font-size:16px">${l?fdate(l):'Jamais'}</b></div></div>
  <div class="group"><label>Numéro WhatsApp</label><input id="wa_n" value="${esc(c.tel)}" placeholder="0555 12 34 56" inputmode="tel"></div>
  <div class="group"><label>Message (modifiable avant l'envoi)</label><textarea id="wa_m" rows="6" style="width:100%">${esc(waText(c))}</textarea></div>
  <div class="btns"><button class="btn" onclick="waSend('${ek(k)}')">Ouvrir WhatsApp</button><button class="btn sec" onclick="clientModal('${ek(k)}')">Retour</button></div>`);
}
function waSend(k){
  k=decodeURIComponent(k);const c=findC(k),raw=$('#wa_n').value.trim(),n=waNum(raw,db.settings.waCode),m=$('#wa_m').value.trim();
  if(!c)return;if(!n){toast('Numéro invalide : saisissez un numéro WhatsApp');return;}if(!m){toast('Le message est vide');return;}
  if(!c.tel){const e=db.clients.find(x=>norm(x.nom)===k);if(e)e.tel=raw;else db.clients.push({id:uid(),nom:c.nom,tel:raw,adr:'',note:''});}
  db.relances.push({k,date:nowI()});save();
  window.open('https://wa.me/'+n+'?text='+encodeURIComponent(m),'_blank');
  toast('WhatsApp ouvert : vérifiez le message puis envoyez-le');clientModal(ek(k));if(tab==='clients')renderClients();
}

const authOn=()=>!!(db.settings.auth&&db.settings.auth.on&&db.settings.auth.admin);
const AUTH=()=>db.settings.auth||(db.settings.auth={on:false,userHide:[]});
async function pwHash(p,fb){
  const salt='sensoft|'+APP.year+'|';
  if(!fb){try{if(window.crypto&&crypto.subtle){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+p));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}}catch(e){}}
  let h1=0xdeadbeef,h2=0x41c6ce57;const s=salt+p;
  for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677);}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return 'fb:'+(4294967296*(2097151&h2)+(h1>>>0)).toString(16);
}
const pwSame=async(p,h)=>!!h&&(await pwHash(p,h.startsWith('fb:')))===h;
const recNorm=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function genRec(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let o='';const r=new Uint8Array(8);
  if(window.crypto&&crypto.getRandomValues)crypto.getRandomValues(r);else for(let i=0;i<8;i++)r[i]=Math.random()*256;
  for(let i=0;i<8;i++)o+=A[r[i]%A.length];return o.slice(0,4)+'-'+o.slice(4);}
let lkFails=0,lkUntil=0;

  el.innerHTML=forgot?`<div class="lk"><div class="ico">🔑</div><h1>Mot de passe oublié ?</h1><p class="muted sm" style="margin:8px 0 14px">Entrez le code de secours donné à l'activation de la protection.</p><input id="lk_rc" placeholder="XXXX-XXXX" autocomplete="off" style="text-align:center;letter-spacing:.1em" onkeydown="if(event.key==='Enter')lockForgotGo()"><div class="er" id="lk_er"></div><div class="btns" style="justify-content:center"><button class="btn" onclick="lockForgotGo()">Réinitialiser</button><button class="btn sec" onclick="lockScreen()">Retour</button></div></div>`
  :`<div class="lk"><div class="ico">🔒</div><h1>${esc(db.settings.shop||APP.name)}</h1><p class="muted sm" style="margin:8px 0 16px">Entrez votre mot de passe</p><input id="lk_pw" type="password" placeholder="Mot de passe" autocomplete="off" onkeydown="if(event.key==='Enter')lockGo()"><div class="er" id="lk_er"></div><div class="btns" style="justify-content:center"><button class="btn" onclick="lockGo()">Déverrouiller</button></div><p style="margin:16px 0 0"><a onclick="lockScreen(true)">Mot de passe oublié ?</a></p></div>`;
  try{trTree(el);}catch(e){}
  setTimeout(()=>{const i=el.querySelector('input');if(i)i.focus();},30);
}

async function lockGo(){
  const a=db.settings.auth,pw=document.getElementById('lk_pw').value;if(!pw)return;
  if(Date.now()<lkUntil){lkErr('Trop d\'essais. Patientez quelques secondes.');return;}
  if(await pwSame(pw,a.admin)){lkFails=0;lkOpen('admin');return;}
  if(await pwSame(pw,a.user)){lkFails=0;lkOpen('user');return;}
  if(++lkFails>=5){lkFails=0;lkUntil=Date.now()+30000;lkErr('Trop d\'essais. Patientez 30 secondes.');}else lkErr('Mot de passe incorrect');
  document.getElementById('lk_pw').select();
}
async function lockForgotGo(){
  const a=db.settings.auth,c=recNorm(document.getElementById('lk_rc').value);
  if(a.rec&&c&&await pwSame(c,a.rec)){a.on=false;delete a.admin;delete a.user;delete a.rec;save();lkOpen(null);role=null;document.body.dataset.role='';renderNav();toast('Protection désactivée. Définissez de nouveaux mots de passe dans Réglages.');}

async function authSave(){
  const a=AUTH(),pa=acv('ac_pa'),pa2=acv('ac_pa2'),pu=acv('ac_pu'),first=!authOn();
  if(first&&!pa)return toast('Saisissez un mot de passe administrateur');

}

const TIPS={"Accueil": ["Vue d'ensemble de l'activité : ventes, bénéfice, stocks à surveiller et crédits en cours.", "نظرة عامة على النشاط: المبيعات والربح والمخزون والديون."], "Caisse": ["Enregistrez une vente : ajoutez les produits, choisissez le client et le mode de paiement.", "سجّل عملية بيع: أضف المنتجات واختر الزبون وطريقة الدفع."], "Produits": ["Gérez votre catalogue : prix, stock, catégories et étiquettes.", "إدارة المنتجات: الأسعار والمخزون والفئات والملصقات."], "Ventes": ["Historique des ventes : consultez, réimprimez un ticket ou annulez une vente.", "سجل المبيعات: استعرض أو أعد طباعة التذكرة أو ألغِ عملية بيع."], "Clients & crédit": ["Fichier clients et suivi des crédits : ce que chaque client vous doit et ses règlements.", "ملف الزبائن ومتابعة الديون: ما يدين به كل زبون وتسديداته."], "Réparations": ["Suivi des appareils en réparation : état, coût, prix et livraison.", "متابعة الأجهزة قيد الإصلاح: الحالة والتكلفة والسعر والتسليم."], "Achats": ["Enregistrez vos achats auprès des fournisseurs.", "سجّل مشترياتك من الموردين."], "Dépenses": ["Notez les charges (loyer, électricité, salaires…) pour calculer le bénéfice net.", "سجّل المصاريف (إيجار، كهرباء، أجور…) لحساب صافي الربح."], "Réglages": ["Boutique, ticket, langue, sauvegarde, mots de passe et personnalisation.", "المتجر والتذكرة واللغة والنسخ الاحتياطي وكلمات المرور والتخصيص."], "Encaisser": ["Valide la vente et enregistre le paiement.", "تأكيد البيع وتسجيل الدفع."], "Annuler": ["Ferme sans enregistrer les changements.", "إغلاق دون حفظ التغييرات."], "Enregistrer": ["Enregistre les informations saisies.", "حفظ المعلومات المدخلة."], "Supprimer": ["Supprime définitivement cet élément.", "حذف هذا العنصر نهائيا."], "Régler": ["Enregistre un paiement sur le crédit du client.", "تسجيل دفعة على دين الزبون."], "Imprimer le ticket": ["Imprime le ticket de caisse de cette vente.", "طباعة تذكرة هذه العملية."], "Annuler la vente": ["Annule cette vente : elle ne sera plus comptée dans les totaux.", "إلغاء هذه العمل let _rev;const AR_REV=()=>_rev||(_rev=new Map(Object.entries(AR_D).map(([k,v])=>[v,k])));
let tipCur=null,tipTimer=null;
function tipNode(){let n=document.getElementById('tip');if(!n){n=document.createElement('div');n.id='tip';n.setAttribute('role','tooltip');document.body.appendChild(n);}return n;}
function tipHide(){clearTimeout(tipTimer);tipCur=null;const n=document.getElementById('tip');if(n)n.classList.remove('on');}
function tipKey(el){let n=el;
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(el.tagName)){if(el.type==='checkbox'||el.type==='radio')return null;const l=el.closest('.group')&&el.closest('.group').querySelector('label');if(!l)return null;n=l;}
  return (n.textContent||'').replace(/\s+/g,' ').replace(/\s*\*$/,'').trim()||null;}
function tipFind(k){if(TIPS[k])return TIPS[k][0];const f=AR_REV().get(k);return f&&TIPS[f]?TIPS[f][1]:null;}
function tipShow(el,txt){const n=tipNode();n.textContent=txt;n.classList.remove('on');n.style.left='0px';n.style.top='0px';
  const r=el.getBoundingClientRect(),w=n.offsetWidth,h=n.offsetHeight;
  const x=Math.min(Math.max(8,r.left+r.width/2-w/2),innerWidth-w-8);let y=r.bottom+8;if(y+h>innerHeight-8)y=Math.max(8,r.top-h-8);
  n.style.left=x+'px';n.style.top=y+'px';n.classList.add('on');}
function tipEnter(e){if(!tipsOn())return;const el=e.target.closest&&e.target.closest('button,.tab,label,.chip,input,select,textarea');
  if(!el||el===tipCur)return;tipHide();const k=tipKey(el),txt=k&&tipFind(k);if(!txt)return;tipCur=el;
  if(el.title&&el.title.trim()===(el.textContent||'').trim())el.removeAttribute('title');
  tipTimer=setTimeout(()=>{if(tipCur===el&&tipsOn())tipShow(el,txt);},450);}
document.addEventListener('mouseover',tipEnter);
document.addEventListener('focusin',tipEnter);
document.addEventListener('mouseout',e=>{if(tipCur&&!tipCur.contains(e.relatedTarget))tipHide();});
document.addEventListener('mousedown',tipHide);document.addEventListener('keydown',tipHide);document.addEventListener('scroll',tipHide,true);
function tipsToggle(v){const on=v===undefined?!tipsOn():!!v;db.settings.tips=on;save();tipHide();renderNav();
  const c=document.getElementById('tipsChk');if(c)c.checked=on;toast(on?'Infos-bulles activées':'Infos-bulles désactivées');}
function tipsCard(){return `<div class="card" style="margin:0"><h2 style="margin-bottom:6px">Infos-bulles d'aide</h2>
  <p class="muted sm" style="margin:0 4px 12px">Passez la souris sur un onglet, un bouton ou un champ pour voir une courte explication. Vous pouvez aussi les activer ou les désactiver avec le bouton ? de la barre de menu.</p>
  <label class="chk" style="margin-left:4px"><input type="checkbox" id="tipsChk" ${tipsOn()?'checked':''} onchange="tipsToggle(this.checked)">Afficher les infos-bulles d'aide</label></div>`;}


/* ================= Mises à jour à distance ================= */
const verGt=(a,b)=>{const x=String(a).split('.').map(Number),y=String(b).split('.').map(Number);for(let i=0;i<3;i++){if((x[i]||0)!==(y[i]||0))return(x[i]||0)>(y[i]||0);}return false;};
let updMan=null;
async function updFetch(url){
  if(window.sensoftUpdater){const r=await window.sensoftUpdater.check(url);if(!r.ok)throw new Error(r.error);return r.data;}
  const r=await fetch(url,{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);return r.json();
}
async function updCheck(manual){
  const u=(db.settings.updUrl||'').trim();
  if(!u){if(manual)toast("Renseignez d'abord l'adresse des mises à jour");return;}
  if(!/^https:\/\//i.test(u)){if(manual)toast("L'adresse doit commencer par https://");return;}
  try{
    const m=await updFetch(u);db.settings.updLast=Date.now();save();
    if(m&&/^\d+\.\d+\.\d+$/.test(m.version||'')&&verGt(m.version,APP.version)){updMan=m;updModal();return;}
    if(manual)toast('Le logiciel est à jour (version '+APP.version+')');
  }catch(e){if(manual)toast('Vérification impossible : '+(e.message||'erreur réseau'));}
}
function updAuto(){if(role==='user'||document.getElementById('lockscr')||!(db.settings.updUrl||'').trim())return;if(Date.now()-(db.settings.updLast||0)<12*36e5)return;updCheck(false);}
function updModal(){const m=updMan,app=!!window.sensoftUpdater,ok=/^https:\/\//i.test(m.url||'');
  openModal(`<h2>Nouvelle version ${esc(m.version)}</h2><p class="muted sm" style="margin:8px 0">Version installée : ${APP.version}</p>${m.notes?`<p style="margin:8px 0">${esc(m.notes)}</p>`:''}<p class="muted sm">Vos données ne sont pas modifiées. Faites une sauvegarde avant de continuer.</p><div class="btns" style="margin-top:14px"><button class="btn sec" onclick="exportAll()">Sauvegarder d'abord</button>${app?`<button class="btn" onclick="updApply()">Mettre à jour maintenant</button>`:(ok?`<a class="btn" href="${esc(m.url)}" target="_blank" rel="noopener" download>Télécharger la nouvelle version</a>`:'')}<button class="btn sec" onclick="closeModal()">Plus tard</button></div>${app?'':'<p class="muted sm" style="margin-top:10px">Remplacez ensuite votre ancien fichier par le nouveau.</p>'}`);}
async function updApply(){try{toast('Téléchargement de la mise à jour…');const r=await window.sensoftUpdater.apply(updMan);if(r&&!r.ok)throw new Error(r.error);}catch(e){toast('Échec : '+(e.message||'erreur'));}}
function updCard(){return `<div class="card" style="margin:0"><h2 style="margin-bottom:6px">Mises à jour</h2>
  <p class="muted sm" style="margin:0 4px 12px">Version installée : <b>${APP.version}</b>. Le logiciel vérifie au démarrage (au plus toutes les 12 h) s'il existe une nouvelle version à l'adresse indiquée.</p>
  <div class="group"><label>Adresse du fichier version.json (https)</label><input id="upd_url" value="${esc(db.settings.updUrl||'')}" placeholder="https://…/version.json" onchange="db.settings.updUrl=this.value.trim();save()"></div>
  <div class="btns"><button class="btn" onclick="updCheck(true)">Vérifier maintenant</button></div></div>`;}
setTimeout(updAuto,6000);

/* ================= Démarrage ================= */
window.addEventListener('load',()=>{
  const h=(location.hash||'').slice(1);tab=TABS.some(t=>t[0]===h)?h:'accueil';if(tabHidden(tab))tab=(visTabs()[0]||TABS[TABS.length-1])[0];
  if(migrated)save();
  if(authOn())lockScreen();
  ordLoad();applyBiz();applyLook();renderNav();render();decorate();bzTree(document.body);trTree(document.body);tick();setInterval(tick,20000);licCheck();setInterval(licCheck,36e5);bkInit().then(()=>{snapAdd();bkWrite();});
  if(migrated)toast(db.products.length+' produit(s) repris de votre générateur d\'étiquettes');
});
</script>
